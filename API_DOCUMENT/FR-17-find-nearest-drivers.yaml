openapi: 3.0.3

info:
  title: Find Nearest Drivers API
  description: API for finding available drivers near the pickup location of a ride.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Driver Matching
    description: APIs for finding available drivers

paths:
  /rides/{rideId}/available-drivers:
    get:
      tags:
        - Driver Matching
      summary: Find nearest available drivers
      description: >
        Finds drivers who are online, use the required vehicle type,
        and are within the configured search radius from the pickup location.
      operationId: findNearestDrivers

      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          description: Unique identifier of the ride
          schema:
            type: string
          example: RID001

        - name: radius
          in: query
          required: false
          description: Search radius in kilometers
          schema:
            type: number
            format: double
            minimum: 0.1
          example: 5

      responses:
        '200':
          description: Available drivers found successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - rideId
                  - radius
                  - total
                  - data
                properties:
                  rideId:
                    type: string
                    example: RID001

                  radius:
                    type: number
                    format: double
                    example: 5

                  total:
                    type: integer
                    example: 2

                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AvailableDriver'

              example:
                rideId: RID001
                radius: 5
                total: 2
                data:
                  - driverId: DRV001
                    driverName: Nguyen Van A
                    vehicleType: MOTORBIKE
                    licensePlate: 59A1-12345
                    latitude: 10.7780
                    longitude: 106.7015
                    distanceKm: 1.2
                    status: ONLINE

                  - driverId: DRV002
                    driverName: Tran Van B
                    vehicleType: MOTORBIKE
                    licensePlate: 59B2-67890
                    latitude: 10.7755
                    longitude: 106.7030
                    distanceKm: 2.4
                    status: ONLINE

        '400':
          description: Invalid ride ID or search radius
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                message: Invalid search radius

        '401':
          description: Unauthorized - missing or invalid JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 401
                message: Unauthorized

        '404':
          description: Ride not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 404
                message: Ride not found

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 500
                message: Internal server error

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    AvailableDriver:
      type: object
      required:
        - driverId
        - driverName
        - vehicleType
        - licensePlate
        - latitude
        - longitude
        - distanceKm
        - status
      properties:
        driverId:
          type: string
          example: DRV001

        driverName:
          type: string
          example: Nguyen Van A

        vehicleType:
          type: string
          enum:
            - MOTORBIKE
            - CAR
          example: MOTORBIKE

        licensePlate:
          type: string
          example: 59A1-12345

        latitude:
          type: number
          format: double
          example: 10.7780

        longitude:
          type: number
          format: double
          example: 106.7015

        distanceKm:
          type: number
          format: double
          example: 1.2

        status:
          type: string
          enum:
            - ONLINE
          example: ONLINE

    ErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          example: 400

        message:
          type: string
          example: Invalid request
