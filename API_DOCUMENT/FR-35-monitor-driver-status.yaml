openapi: 3.0.3

info:
  title: Driver Status Monitoring API
  description: API for operators to monitor the current status of drivers.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Driver Status Monitoring
    description: APIs for monitoring driver status

paths:
  /drivers/status:
    get:
      tags:
        - Driver Status Monitoring
      summary: Get driver statuses
      description: Returns a list of drivers and their current availability status.
      operationId: getDriverStatuses

      security:
        - bearerAuth: []

      parameters:
        - name: status
          in: query
          required: false
          description: Filter drivers by current status
          schema:
            type: string
            enum:
              - ONLINE
              - BUSY
              - OFFLINE
          example: ONLINE

        - name: page
          in: query
          required: false
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1

        - name: limit
          in: query
          required: false
          description: Number of drivers per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          example: 10

      responses:
        '200':
          description: Driver statuses retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverStatusListResponse'
              example:
                page: 1
                limit: 10
                total: 3
                data:
                  - driverId: DRV001
                    driverName: Nguyen Van A
                    vehicleType: MOTORBIKE
                    licensePlate: 59A1-12345
                    status: ONLINE
                    latitude: 10.7765
                    longitude: 106.7009
                    updatedAt: "2026-09-07T20:10:00Z"

                  - driverId: DRV002
                    driverName: Tran Van B
                    vehicleType: CAR
                    licensePlate: 51H-67890
                    status: BUSY
                    latitude: 10.7756
                    longitude: 106.7012
                    updatedAt: "2026-09-07T20:09:00Z"

                  - driverId: DRV003
                    driverName: Le Van C
                    vehicleType: MOTORBIKE
                    licensePlate: 59B1-45678
                    status: OFFLINE
                    latitude: null
                    longitude: null
                    updatedAt: "2026-09-07T18:30:00Z"

        '400':
          description: Invalid query parameters
          content:
            application/json:
              example:
                message: Invalid status or pagination parameter.

        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                message: Authentication is required.

        '403':
          description: Forbidden
          content:
            application/json:
              example:
                message: Only operators can monitor driver status.

        '500':
          description: Internal server error
          content:
            application/json:
              example:
                message: Internal server error.

components:

  schemas:

    DriverStatusListResponse:
      type: object
      properties:
        page:
          type: integer
          example: 1

        limit:
          type: integer
          example: 10

        total:
          type: integer
          example: 3

        data:
          type: array
          items:
            $ref: '#/components/schemas/DriverStatus'

    DriverStatus:
      type: object
      properties:
        driverId:
          type: string
          example: DRV001

        driverName:
          type: string
          example: Nguyen Van A

        vehicleType:
          type: string
          enum:
            - MOTORBIKE
            - CAR
          example: MOTORBIKE

        licensePlate:
          type: string
          example: 59A1-12345

        status:
          type: string
          enum:
            - ONLINE
            - BUSY
            - OFFLINE
          example: ONLINE

        latitude:
          type: number
          format: double
          nullable: true
          example: 10.7765

        longitude:
          type: number
          format: double
          nullable: true
          example: 106.7009

        updatedAt:
          type: string
          format: date-time
          example: "2026-09-07T20:10:00Z"

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
