openapi: 3.0.3

info:
  title: Ride and Transaction History API
  description: API for operators to search and view ride and transaction history.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Ride History
    description: APIs for searching ride history
  - name: Transaction History
    description: APIs for searching transaction history

paths:

  /operator/ride-history:
    get:
      tags:
        - Ride History
      summary: Search ride history
      description: Allows operators to search and view historical rides.
      operationId: searchRideHistory

      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: query
          required: false
          description: Filter by ride ID
          schema:
            type: string
          example: RID001

        - name: customerId
          in: query
          required: false
          description: Filter by customer ID
          schema:
            type: string
          example: CUS001

        - name: driverId
          in: query
          required: false
          description: Filter by driver ID
          schema:
            type: string
          example: DRV001

        - name: status
          in: query
          required: false
          description: Filter rides by status
          schema:
            type: string
            enum:
              - COMPLETED
              - CANCELLED
          example: COMPLETED

        - name: fromDate
          in: query
          required: false
          description: Start date for searching ride history
          schema:
            type: string
            format: date
          example: "2026-09-01"

        - name: toDate
          in: query
          required: false
          description: End date for searching ride history
          schema:
            type: string
            format: date
          example: "2026-09-07"

        - name: page
          in: query
          required: false
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1

        - name: limit
          in: query
          required: false
          description: Number of records per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          example: 10

      responses:

        '200':
          description: Ride history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideHistoryResponse'
              example:
                page: 1
                limit: 10
                total: 1
                data:
                  - rideId: RID001
                    customerId: CUS001
                    driverId: DRV001
                    serviceTypeCode: MOTORBIKE
                    pickupAddress: 123 Nguyen Hue, District 1
                    destinationAddress: 456 Dien Bien Phu, District 3
                    status: COMPLETED
                    fare: 41000
                    completedAt: "2026-09-07T20:00:00Z"

        '400':
          description: Invalid search parameters
          content:
            application/json:
              example:
                message: Invalid date range or pagination parameters.

        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                message: Authentication is required.

        '403':
          description: Forbidden
          content:
            application/json:
              example:
                message: Only operators can search ride history.

        '500':
          description: Internal server error
          content:
            application/json:
              example:
                message: Internal server error.

  /operator/transaction-history:
    get:
      tags:
        - Transaction History
      summary: Search transaction history
      description: Allows operators to search and view historical payment transactions.
      operationId: searchTransactionHistory

      security:
        - bearerAuth: []

      parameters:
        - name: transactionId
          in: query
          required: false
          description: Filter by transaction ID
          schema:
            type: string
          example: TXN001

        - name: rideId
          in: query
          required: false
          description: Filter by ride ID
          schema:
            type: string
          example: RID001

        - name: customerId
          in: query
          required: false
          description: Filter by customer ID
          schema:
            type: string
          example: CUS001

        - name: status
          in: query
          required: false
          description: Filter transactions by status
          schema:
            type: string
            enum:
              - PENDING
              - SUCCESS
              - FAILED
          example: SUCCESS

        - name: fromDate
          in: query
          required: false
          description: Start date for searching transactions
          schema:
            type: string
            format: date
          example: "2026-09-01"

        - name: toDate
          in: query
          required: false
          description: End date for searching transactions
          schema:
            type: string
            format: date
          example: "2026-09-07"

        - name: page
          in: query
          required: false
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1

        - name: limit
          in: query
          required: false
          description: Number of records per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          example: 10

      responses:

        '200':
          description: Transaction history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionHistoryResponse'
              example:
                page: 1
                limit: 10
                total: 1
                data:
                  - transactionId: TXN001
                    rideId: RID001
                    customerId: CUS001
                    paymentMethod: ONLINE
                    amount: 41000
                    status: SUCCESS
                    createdAt: "2026-09-07T20:00:30Z"
                    updatedAt: "2026-09-07T20:01:00Z"

        '400':
          description: Invalid search parameters
          content:
            application/json:
              example:
                message: Invalid date range or pagination parameters.

        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                message: Authentication is required.

        '403':
          description: Forbidden
          content:
            application/json:
              example:
                message: Only operators can search transaction history.

        '500':
          description: Internal server error
          content:
            application/json:
              example:
                message: Internal server error.

components:

  schemas:

    RideHistoryResponse:
      type: object
      properties:
        page:
          type: integer
          example: 1

        limit:
          type: integer
          example: 10

        total:
          type: integer
          example: 1

        data:
          type: array
          items:
            $ref: '#/components/schemas/RideHistoryItem'

    RideHistoryItem:
      type: object
      properties:
        rideId:
          type: string
          example: RID001

        customerId:
          type: string
          example: CUS001

        driverId:
          type: string
          example: DRV001

        serviceTypeCode:
          type: string
          enum:
            - MOTORBIKE
            - CAR
          example: MOTORBIKE

        pickupAddress:
          type: string
          example: 123 Nguyen Hue, District 1

        destinationAddress:
          type: string
          example: 456 Dien Bien Phu, District 3

        status:
          type: string
          enum:
            - COMPLETED
            - CANCELLED
          example: COMPLETED

        fare:
          type: number
          format: double
          example: 41000

        completedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-09-07T20:00:00Z"

    TransactionHistoryResponse:
      type: object
      properties:
        page:
          type: integer
          example: 1

        limit:
          type: integer
          example: 10

        total:
          type: integer
          example: 1

        data:
          type: array
          items:
            $ref: '#/components/schemas/TransactionHistoryItem'

    TransactionHistoryItem:
      type: object
      properties:
        transactionId:
          type: string
          example: TXN001

        rideId:
          type: string
          example: RID001

        customerId:
          type: string
          example: CUS001

        paymentMethod:
          type: string
          enum:
            - CASH
            - ONLINE
          example: ONLINE

        amount:
          type: number
          format: double
          example: 41000

        status:
          type: string
          enum:
            - PENDING
            - SUCCESS
            - FAILED
          example: SUCCESS

        createdAt:
          type: string
          format: date-time
          example: "2026-09-07T20:00:30Z"

        updatedAt:
          type: string
          format: date-time
          example: "2026-09-07T20:01:00Z"

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
