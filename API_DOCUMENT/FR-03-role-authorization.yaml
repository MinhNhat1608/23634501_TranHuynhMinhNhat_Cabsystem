openapi: 3.0.3

info:
  title: Role Authorization API
  description: API quản lý và kiểm tra quyền truy cập của người dùng theo vai trò Customer, Driver và Operator.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Authorization
    description: Quản lý phân quyền người dùng

paths:

  /users/{userId}/role:
    get:
      tags:
        - Authorization
      summary: Xem vai trò người dùng
      description: Trả về vai trò hiện tại của người dùng.
      operationId: getUserRole

      parameters:
        - name: userId
          in: path
          required: true
          description: Mã người dùng
          schema:
            type: string
          example: USR001

      responses:

        '200':
          description: Lấy vai trò thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
              example:
                success: true
                message: Lấy vai trò thành công
                data:
                  userId: USR001
                  role: CUSTOMER

        '404':
          description: Không tìm thấy người dùng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Không tìm thấy người dùng

        '500':
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Internal server error

components:

  schemas:

    RoleResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            userId:
              type: string
            role:
              type: string
              enum:
                - CUSTOMER
                - DRIVER
                - OPERATOR

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
