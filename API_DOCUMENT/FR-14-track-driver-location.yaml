openapi: 3.0.3

info:
  title: Driver Location Tracking API
  description: API for customers to track the driver's real-time location during a ride
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Driver Location Tracking
    description: Driver location tracking management

paths:

  /rides/{rideId}/driver-location:

    get:
      tags:
        - Driver Location Tracking
      summary: Get driver's current location
      description: Customer retrieves the current location of the assigned driver
      operationId: getDriverLocation

      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          description: Unique identifier of the ride
          schema:
            type: string
          example: "RID001"

      responses:

        '200':
          description: Driver location retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverLocationResponse'
              example:
                rideId: "RID001"
                driverId: "DRV001"
                latitude: 10.7798
                longitude: 106.6923
                updatedAt: "2026-09-07T18:35:00Z"

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '403':
          description: User does not have permission to track this ride
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Ride or driver location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: Driver location is not available for the current ride status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    DriverLocationResponse:
      type: object
      required:
        - rideId
        - driverId
        - latitude
        - longitude
        - updatedAt

      properties:

        rideId:
          type: string
          description: Unique identifier of the ride
          example: "RID001"

        driverId:
          type: string
          description: Unique identifier of the driver
          example: "DRV001"

        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Current latitude of the driver
          example: 10.7798

        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Current longitude of the driver
          example: 106.6923

        updatedAt:
          type: string
          format: date-time
          description: Time when the driver's location was last updated
          example: "2026-09-07T18:35:00Z"

    ErrorResponse:
      type: object
      properties:

        code:
          type: string
          example: "RIDE_NOT_FOUND"

        message:
          type: string
          example: "Ride not found."
