openapi: 3.0.3

info:
  title: Service Type API
  description: API cho phép người dùng xem và lựa chọn loại dịch vụ di chuyển.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Service Type
    description: Quản lý loại dịch vụ

paths:

  /service-types:
    get:
      tags:
        - Service Type
      summary: Xem danh sách loại dịch vụ
      description: Trả về danh sách các loại dịch vụ đang được cung cấp.
      operationId: getServiceTypes

      responses:

        '200':
          description: Lấy danh sách loại dịch vụ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceTypeListResponse'
              example:
                success: true
                message: Lấy danh sách loại dịch vụ thành công
                data:
                  - serviceTypeId: ST001
                    code: MOTORBIKE
                    name: Xe máy
                    description: Dịch vụ di chuyển bằng xe máy
                    status: ACTIVE
                  - serviceTypeId: ST002
                    code: CAR
                    name: Ô tô
                    description: Dịch vụ di chuyển bằng ô tô
                    status: ACTIVE

        '500':
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Internal server error

  /service-types/{serviceTypeId}:
    get:
      tags:
        - Service Type
      summary: Xem thông tin loại dịch vụ
      description: Trả về thông tin chi tiết của một loại dịch vụ.
      operationId: getServiceTypeById

      parameters:
        - name: serviceTypeId
          in: path
          required: true
          description: Mã loại dịch vụ
          schema:
            type: string
          example: ST001

      responses:

        '200':
          description: Lấy thông tin loại dịch vụ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceTypeResponse'
              example:
                success: true
                message: Lấy thông tin loại dịch vụ thành công
                data:
                  serviceTypeId: ST001
                  code: MOTORBIKE
                  name: Xe máy
                  description: Dịch vụ di chuyển bằng xe máy
                  status: ACTIVE

        '404':
          description: Không tìm thấy loại dịch vụ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Không tìm thấy loại dịch vụ

        '500':
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Internal server error

components:

  schemas:

    ServiceType:
      type: object
      properties:
        serviceTypeId:
          type: string
        code:
          type: string
          enum:
            - MOTORBIKE
            - CAR
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE

    ServiceTypeListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/ServiceType'

    ServiceTypeResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/ServiceType'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
