openapi: 3.0.3

info:
  title: Ride Rating API
  description: API for customers to rate a completed ride.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Ride Rating
    description: APIs for rating completed rides

paths:

  /rides/{rideId}/rating:
    post:
      tags:
        - Ride Rating
      summary: Rate a completed ride
      description: Allows the customer who booked the ride to rate the completed ride from 1 to 5 stars and optionally provide a comment.
      operationId: rateRide

      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          description: Unique identifier of the ride
          schema:
            type: string
          example: RID001

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideRatingRequest'
            example:
              rating: 5
              comment: Driver was friendly and arrived on time.

      responses:

        '201':
          description: Ride rating created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideRatingResponse'
              example:
                ratingId: RAT001
                rideId: RID001
                customerId: CUS001
                driverId: DRV001
                rating: 5
                comment: Driver was friendly and arrived on time.
                createdAt: "2026-09-07T20:30:00Z"

        '400':
          description: Invalid rating data
          content:
            application/json:
              example:
                message: Rating must be between 1 and 5.

        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                message: Authentication is required.

        '403':
          description: Forbidden
          content:
            application/json:
              example:
                message: Only the customer who booked the ride can rate it.

        '404':
          description: Ride not found
          content:
            application/json:
              example:
                message: Ride not found.

        '409':
          description: Ride cannot be rated
          content:
            application/json:
              example:
                message: The ride has already been rated or is not completed.

        '500':
          description: Internal server error
          content:
            application/json:
              example:
                message: Internal server error.

components:

  schemas:

    RideRatingRequest:
      type: object
      required:
        - rating
      properties:

        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Rating from 1 to 5 stars
          example: 5

        comment:
          type: string
          nullable: true
          maxLength: 500
          description: Optional comment about the ride
          example: Driver was friendly and arrived on time.

    RideRatingResponse:
      type: object
      properties:

        ratingId:
          type: string
          example: RAT001

        rideId:
          type: string
          example: RID001

        customerId:
          type: string
          example: CUS001

        driverId:
          type: string
          example: DRV001

        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5

        comment:
          type: string
          nullable: true
          example: Driver was friendly and arrived on time.

        createdAt:
          type: string
          format: date-time
          example: "2026-09-07T20:30:00Z"

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
