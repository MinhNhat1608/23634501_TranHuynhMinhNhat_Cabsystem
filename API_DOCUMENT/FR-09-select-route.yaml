openapi: 3.0.3

info:
  title: Route Selection API
  description: API cho phép người dùng chọn điểm đón, điểm đến và nhận thông tin lộ trình di chuyển.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Route
    description: Quản lý lộ trình di chuyển

paths:

  /routes/estimate:
    post:
      tags:
        - Route
      summary: Chọn lộ trình di chuyển
      description: Nhận điểm đón và điểm đến, sau đó trả về thông tin lộ trình dự kiến.
      operationId: estimateRoute

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
            example:
              pickup:
                latitude: 10.7769
                longitude: 106.7009
              destination:
                latitude: 10.8231
                longitude: 106.6297

      responses:

        '200':
          description: Lấy lộ trình thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
              example:
                success: true
                message: Lấy lộ trình thành công
                data:
                  pickup:
                    latitude: 10.7769
                    longitude: 106.7009
                  destination:
                    latitude: 10.8231
                    longitude: 106.6297
                  distanceKm: 8.5
                  estimatedDurationMinutes: 25

        '400':
          description: Dữ liệu điểm đón hoặc điểm đến không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Tọa độ điểm đón hoặc điểm đến không hợp lệ

        '401':
          description: Chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Unauthorized

        '404':
          description: Không tìm được lộ trình
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Không tìm được lộ trình phù hợp

        '500':
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Internal server error

components:

  schemas:

    Coordinate:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Vĩ độ
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Kinh độ

    RouteRequest:
      type: object
      required:
        - pickup
        - destination
      properties:
        pickup:
          $ref: '#/components/schemas/Coordinate'
        destination:
          $ref: '#/components/schemas/Coordinate'

    RouteResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            pickup:
              $ref: '#/components/schemas/Coordinate'
            destination:
              $ref: '#/components/schemas/Coordinate'
            distanceKm:
              type: number
              format: double
            estimatedDurationMinutes:
              type: integer

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
