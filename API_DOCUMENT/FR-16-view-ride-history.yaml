openapi: 3.0.3

info:
  title: Ride History API
  description: API for customers and drivers to view ride history
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Ride History
    description: Ride history management

paths:

  /rides/history:

    get:
      tags:
        - Ride History
      summary: Get ride history
      description: Retrieve the ride history of the authenticated customer or driver
      operationId: getRideHistory

      security:
        - bearerAuth: []

      parameters:

        - name: page
          in: query
          required: false
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1

        - name: limit
          in: query
          required: false
          description: Number of rides per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          example: 10

      responses:

        '200':
          description: Ride history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideHistoryResponse'
              example:
                page: 1
                limit: 10
                total: 2
                data:
                  - rideId: "RID001"
                    customerId: "CUS001"
                    driverId: "DRV001"
                    serviceTypeCode: "MOTORBIKE"
                    pickupAddress: "227 Nguyen Van Cu, District 5, Ho Chi Minh City"
                    destinationAddress: "Tan Son Nhat International Airport"
                    status: "COMPLETED"
                    fare: 75000
                    completedAt: "2026-09-07T18:30:00Z"
                  - rideId: "RID002"
                    customerId: "CUS001"
                    driverId: "DRV002"
                    serviceTypeCode: "CAR"
                    pickupAddress: "District 1, Ho Chi Minh City"
                    destinationAddress: "District 7, Ho Chi Minh City"
                    status: "CANCELLED"
                    fare: 0
                    completedAt: null

        '400':
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    RideHistoryResponse:
      type: object

      required:
        - page
        - limit
        - total
        - data

      properties:

        page:
          type: integer
          example: 1

        limit:
          type: integer
          example: 10

        total:
          type: integer
          example: 2

        data:
          type: array
          items:
            $ref: '#/components/schemas/RideHistoryItem'

    RideHistoryItem:
      type: object

      properties:

        rideId:
          type: string
          example: "RID001"

        customerId:
          type: string
          example: "CUS001"

        driverId:
          type: string
          example: "DRV001"

        serviceTypeCode:
          type: string
          enum:
            - MOTORBIKE
            - CAR
          example: "MOTORBIKE"

        pickupAddress:
          type: string
          example: "227 Nguyen Van Cu, District 5, Ho Chi Minh City"

        destinationAddress:
          type: string
          example: "Tan Son Nhat International Airport"

        status:
          type: string
          enum:
            - COMPLETED
            - CANCELLED
          example: "COMPLETED"

        fare:
          type: number
          format: double
          minimum: 0
          example: 75000

        completedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-09-07T18:30:00Z"

    ErrorResponse:
      type: object

      properties:

        code:
          type: string
          example: "INVALID_REQUEST"

        message:
          type: string
          example: "Invalid pagination parameters."
